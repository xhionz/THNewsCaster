title: Detection of CVE-2019-1068 Exploitation via SQL Extended Procedures
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    CommandLine: '*sp_OACreate*' OR '*xp_cmdshell*' OR '*sp_OAMethod*'
  condition: selection
fields:
  - User
  - CommandLine
  - ParentCommandLine
