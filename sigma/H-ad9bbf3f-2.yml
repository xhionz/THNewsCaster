title: Suspicious PowerShell Execution via Spoofed Parent Process
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    Image: '*\powershell.exe'
    ParentImage:
      - 'C:\Windows\System32\svchost.exe'
      - 'C:\Windows\explorer.exe'
      - 'C:\Windows\System32\dllhost.exe'
    CommandLine: '*-enc*'
    CommandLine: '*-e *'
    CommandLine: '*-nop *'
    CommandLine: '*-w hidden*'
    CommandLine: '*IEX *'
    CommandLine: '*Invoke-Expression *'
  condition: selection
  keywords:
    - '-enc'
    - '-e '
    - '-nop'
    - '-w hidden'
    - 'IEX '
    - 'Invoke-Expression'
condition: selection
