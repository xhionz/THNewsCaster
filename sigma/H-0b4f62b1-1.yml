title: Suspicious Zimbra Web Client Access with Malicious User-Agent
logsource:
  product: webserver
  service: zimbra
condition: 'selection_1'
detection:
  selection_1:
    client_agent: 'Mozilla/5.0*'
  selection_2:
    client_agent: 'Zimbra Web Client*'
  condition: selection_1 and not selection_2
  timeframe: 7d
