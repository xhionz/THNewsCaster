title: Detect Cisco UCM SSRF to AWS Metadata
logsource:
  product: cisco_ucm
  service: http
condition: 'http_request.uri contains "169.254.169.254" and http_request.method == "GET" and http_request.status_code == 200'
detection:
  http_request:
    uri:
      - "169.254.169.254"
    method: "GET"
    status_code: 200
