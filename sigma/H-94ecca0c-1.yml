title: Detect N-central Auth Bypass via POST to /n-central/api/auth/login
logsource:
  product: webserver
  category: http_request
detection:
  selection:
    http_method: 'POST'
    http_uri: '/n-central/api/auth/login'
    http_referer: ''
    http_status: '200'
    client_ip: '192.168.0.0/16'
  condition: selection
fields:
  - client_ip
  - http_uri
  - http_user_agent
