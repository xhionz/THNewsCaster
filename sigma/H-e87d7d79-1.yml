title: Suspicious Certificate Template Modification
id: 1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p
status: experimental
description: Detects modification of certificate templates via AD audit events
logsource:
  product: windows
  service: security
detection:
  EventID: 4662
  ObjectClass: 'certificationAuthority'
  Properties: '*1.3.6.1.4.1.311.20.2.1*'  # Template modification flag
  SubjectUserName: '*'
  - not: SubjectUserName: 'NT AUTHORITY\SYSTEM'
  - not: SubjectUserName: 'DOMAIN\Enterprise Admins'
condition: all
level: high
