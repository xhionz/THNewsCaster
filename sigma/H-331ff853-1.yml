title: Suspicious Redirect via ChatGPT Share Link
logsource:
  product: windows
  service: security
detection:
  Selection:
    CommandLine: '*chatgpt.com/share/*'
    Image: '*\chrome.exe' or '*\firefox.exe' or '*\edge.exe'
  Condition: Selection
  Keywords: []
  # Note: Keywords field removed - replaced with field-based detection
condition: Selection
