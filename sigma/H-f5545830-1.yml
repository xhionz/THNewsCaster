title: PowerShell Download from GitHub Raw
id: 1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p
status: experimental
description: Detects PowerShell invoking Invoke-RestMethod or Invoke-WebRequest against raw.githubusercontent.com
detection:
  selection:
    Image: '*\powershell.exe'
    CommandLine: '*Invoke-RestMethod*' '*raw.githubusercontent.com*'
  condition: selection
logsource:
  product: windows
  service: powershell
