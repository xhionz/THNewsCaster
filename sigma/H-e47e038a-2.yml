title: BTR.sys Used to Disable EDR Telemetry
logsource:
  product: windows
  service: driver
condition: 'Image|endswith: "\BTR.sys" and (CommandLine|contains: "delete" or CommandLine|contains: "remove" or CommandLine|contains: "-f" or CommandLine|contains: "/f") and (TargetFile|contains: "CrowdStrike" or TargetFile|contains: "SentinelOne" or TargetFile|contains: "CarbonBlack" or TargetFile|contains: "Microsoft\Windows Defender\')'
detection:
  Image:
    - "\BTR.sys"
  CommandLine:
    - "delete"
    - "remove"
    - "-f"
    - "/f"
  TargetFile:
    - "CrowdStrike"
    - "SentinelOne"
    - "CarbonBlack"
    - "Microsoft\\Windows Defender"
condition: all
