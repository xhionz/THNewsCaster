title: Suspicious DNS Tunneling via Long Subdomains
logsource:
  product: dns
  service: query
detection:
  selection:
    query: '*.*.*.*.*.*'
    query_length: '>50'
    src_ip: '10.0.0.0/8' OR '172.16.0.0/12' OR '192.168.0.0/16'
    dst_ip: '176.126.128.0/18' OR '37.148.208.0/20' OR '91.219.128.0/18'
    response_type: 'A'
    not:
      - query: '*.microsoft.com'
      - query: '*.google.com'
      - query: '*.apple.com'
      - query: '*.amazon.com'
      - query: '*.cloudflare.com'
  condition: selection
  keywords:
    - '.*.*.*.*.*'
    - 'query_length:>50'
condition: selection
