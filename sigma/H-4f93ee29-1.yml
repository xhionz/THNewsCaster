title: Lazarus Script Host Spawning Privileged Process
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    CommandLine:
      - '*mshta.exe*'
      - '*wscript.exe*'
      - '*cscript.exe*'
    ParentCommandLine: '*'
    NewProcessName:
      - '*svchost.exe*'
      - '*lsass.exe*'
  condition: selection
fields:
  - NewProcessName
  - CommandLine
  - ParentCommandLine
