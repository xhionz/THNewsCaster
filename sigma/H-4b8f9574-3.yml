title: Suspicious Model File Exfiltration
logsource:
  product: webserver
detection:
  request_uri:
    - '/api/v1/upload'
    - '/api/v1/export'
  status_code: 200
  file_extension:
    - '.pkl'
    - '.pt'
    - '.onnx'
    - '.h5'
condition: 'request_uri contains "/api/v1/" and (file_extension contains ".pkl" or file_extension contains ".pt" or file_extension contains ".onnx" or file_extension contains ".h5") and status_code == 200'
