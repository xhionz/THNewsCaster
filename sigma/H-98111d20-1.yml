title: SINEC OS Path Traversal Attempt
logsource:
  product: linux
  service: httpd
detection:
  req_uri:
    - '/../../../../etc/passwd'
    - '/../../../../etc/shadow'
    - '/..\..\..\..\windows\system32\drivers\etc\hosts'
  user_agent:
    - 'curl'
    - 'wget'
    - 'python-requests'
  status_code: 200
condition: any of req_uri
