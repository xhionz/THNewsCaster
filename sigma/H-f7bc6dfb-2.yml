title: Suspicious Database Tool Execution with Outbound HTTPS
logsource:
  product: windows
  service: security
detection:
  Selection1:
    EventID: 4688
    CommandLine: '*bcp*' OR '*sqlcmd*'
    ParentCommandLine: '*powershell*' OR '*cmd*'
  Selection2:
    EventID: 5156
    Process: '*bcp.exe*' OR '*sqlcmd.exe*'
    RemotePort: 443
  Selection3:
    EventID: 4688
    CommandLine: '*bcp*' OR '*sqlcmd*'
    Image: '*\bcp.exe' OR '*\sqlcmd.exe'
condition: Selection1 or Selection2 or Selection3
