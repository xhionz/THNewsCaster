title: Infostealer - Keylogger Activity Detected
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image: '*\svchost.exe'
    CommandLine: '*-k netsvcs*'
    ParentImage: '*\explorer.exe'
  condition: selection
  falsepositives:
    - Legitimate system services
  level: high
