title: Suspicious ProfSvc ServiceImagePath Modification
logsource:
  product: windows
  service: registry
detection:
  Selection:
    EventID: 4657
    RegistryKey: '.*\\SYSTEM\\CurrentControlSet\\Services\\ProfSvc\\ImagePath'
    RegistryValueName: 'ImagePath'
    RegistryValueType: 'REG_EXPAND_SZ'
    RegistryNewValue: '*\*.exe'
  Condition: Selection
fields:
  - RegistryKey
  - RegistryNewValue
  - User
