title: Detect Failed Login Storm to Vendor Portal
logsource:
  product: web_application
  category: authentication
detection:
  selection:
    event_type: login_failed
    user_agent: '*Mozilla*' OR '*curl*' OR '*python-requests*'
    src_ip: '192.168.0.0/16' OR '10.0.0.0/8'
    timestamp: > '2026-08-01T00:00:00Z' AND < '2026-08-31T23:59:59Z'
  condition: selection
  timeframe: 10m
