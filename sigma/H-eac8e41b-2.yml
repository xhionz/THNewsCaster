title: WordPress Brute Force Login Attempts
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    AccountName|contains: 'admin'
    AccountName|contains: 'administrator'
    AccountName|contains: 'user'
    LogonType: 3
  condition: selection
fields:
  - AccountName
  - SourceIpAddress
  - LogonType
