title: Detect CVE-2024-21762 Exploitation via /remote/fgt_lang
logsource:
  product: fortigate
  service: http
detection:
  request_uri:
    - '/remote/fgt_lang'
    - '/remote/fgt_lang?lang='
    - '/remote/fgt_lang?lang=..%2f'
  user_agent: 'Mozilla/5.0*'
  status_code: 200
  response_size: '>5000'
condition: all of them
