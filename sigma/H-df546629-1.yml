title: Detect ColdFusion Path Traversal Exploitation
logsource:
  product: adobe_coldfusion
  category: application
detection:
  selection:
    uri: 
      - '*../'
      - '*%2e%2e%2f'
      - '*%252e%252e%252f'
      - '*CFIDE/adminapi/'
  condition: selection
fields:
  - uri
  - client_ip
  - user_agent
references:
  - https://www.adobe.com/support/security/advisories/APSB23-12.html
author: Threat Hunting Team
date: '2026-07-08'
