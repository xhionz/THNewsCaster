title: Suspicious Base64-encoded HTTP POST to FreePBX Admin
id: 3c4d5e6f-7g8h-9i0j-1k2l-3m4n5o6p7q8r
status: experimental
description: Detects HTTP POST requests to FreePBX admin endpoints with high entropy base64-like content
logsource:
  product: webserver
  service: http
detection:
  selection:
    method: 'POST'
    uri: '/admin/*'
    content_length: '>500'
    user_agent: 'Mozilla/*'
  condition: selection and (http_request_body contains 'AAAA' or http_request_body contains 'AQAA' or http_request_body contains 'BAAA' or http_request_body contains 'CAAA')
condition: selection
