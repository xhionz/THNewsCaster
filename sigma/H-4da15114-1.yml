title: Detect CVE-2021-26855 OWA Exploitation
logsource:
  product: exchange_server
  service: iis
condition: '1 of them'
detection:
  selection:
    uri: '/ecp/default.aspx'
    method: 'POST'
    status: 200
  selection2:
    uri: '/ecp/'
    user_agent: 'Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Trident/5.0)'
  condition: selection and selection2
