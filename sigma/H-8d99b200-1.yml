title: HTTP/2 CONTINUATION Frame Flood Detection
logsource:
  product: nginx
  service: access_log
detection:
  sel:
    http2_frame_type: 0x9
    http2_frame_length: '>10000'
    http2_stream_id: '>=100'
  condition: sel
aliases:
  http2_frame_type: 'frame_type'
  http2_frame_length: 'frame_length'
  http2_stream_id: 'stream_id'
