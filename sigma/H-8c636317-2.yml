title: Suspicious Large HTTPS Exfiltration from Chrome
logsource:
  product: windows
  service: sysmon
detection:
  Selection:
    Image|endswith: '\chrome.exe'
    EventType: NetworkConnect
    DestinationIp|startswith: '185.' or DestinationIp|startswith: '192.168.' or DestinationIp|startswith: '10.'
    BytesSent > 50000000
  Condition: Selection
condition: Selection
