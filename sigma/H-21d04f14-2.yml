title: Kimsuky VS Code SSH Reverse Tunneling
id: 2b3c4d5e-6f7g-8h9i-0j1k
status: experimental
description: Detects ssh.exe spawned by Code.exe with -R flag for reverse tunneling
logsource:
  product: windows
  service: sysmon
detection:
  parent_process:
    Image: '*\Code.exe'
  child_process:
    Image: '*\ssh.exe'
    CommandLine: '*-R*'
  condition: parent_process and child_process
level: high
