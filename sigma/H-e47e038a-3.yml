title: BTR.sys Used for Kernel Persistence via Registry or Driver Load
logsource:
  product: windows
  service: driver
condition: 'Image|endswith: "\BTR.sys" and (CommandLine|contains: "reg add" or CommandLine|contains: "regsvr32" or TargetFile|endswith: ".sys" or TargetFile|contains: "\System32\drivers\")'
detection:
  Image:
    - "\BTR.sys"
  CommandLine:
    - "reg add"
    - "regsvr32"
  TargetFile:
    - "\\System32\\drivers\\"
condition: all
