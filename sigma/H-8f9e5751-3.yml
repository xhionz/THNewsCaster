title: Spearphishing Email with Suspicious URL
id: 3c4d5e6f-7g8h-9i0j-1k2l-3m4n5o6p7q8r
status: experimental
description: Detects emails containing URLs matching known phishing domain patterns
logsource:
  product: email
detection:
  selection:
    subject:
      - '*login*'
      - '*verify*'
      - '*account*'
      - '*urgent*'
    url:
      - '*login-*.com'
      - '*auth-*.net'
      - '*secure-*.org'
      - '*signin-*.info'
  condition: selection
level: high
