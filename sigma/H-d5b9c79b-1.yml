title: Detect N-central Auth Bypass via Anomalous Login Attempts
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    AccountName: 'anonymous' | 'guest' | 'null'
    LogonType: 3
  condition: selection
fields:
  - AccountName
  - LogonType
  - SourceNetworkAddress
