title: Lateral Movement via Default Credentials - IoT/OT
logsource:
  product: authentication
  service: ssh
  category: login
detection:
  selection:
    Username:
      - 'admin'
      - 'root'
      - 'user'
      - 'guest'
    Password:
      - 'admin'
      - 'password'
      - '1234'
      - '0000'
      - 'guest'
    SourceIP:
      - '192.168.10.0/24'
      - '10.20.30.0/24'
  condition: selection
fields:
  - Username
  - SourceIP
  - DestinationIP
  - Timestamp
