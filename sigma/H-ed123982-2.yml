title: Detect Medusa-style obfuscation in PowerShell execution
logsource:
  product: windows
  service: powershell
condition: 'event_id: 4104 and script_block_text contains "base64" and script_block_text contains "IEX"'
detection:
  selection:
    event_id: 4104
    script_block_text:
      - "base64"
      - "IEX"
  condition: selection
