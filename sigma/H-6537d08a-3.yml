title: Detect Exploitation Targeting Manufacturing ASA/FTD
logsource:
  product: firewall
  service: http
detection:
  dest_ip: '10.10.20.0/24'
  req_uri:
    - '/admin'
    - '/cli'
    - '/api/v1/config'
  http_user_agent: '.*\x00.*'
  http_method: 'POST'
  status_code: 500
condition: all of them
