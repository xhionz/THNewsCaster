title: Detect LSASS Memory Dump via rundll32 + comsvcs.dll
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image: '*\\rundll32.exe'
    CommandLine: '*comsvcs.dll*,*MiniDump*' AND CommandLine: '*lsass*' AND CommandLine: '*C:\\Windows\\System32\\lsass.exe*'
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
