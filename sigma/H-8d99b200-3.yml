title: HTTP/2 RST_STREAM Flood Detection
logsource:
  product: nginx
  service: access_log
detection:
  sel:
    http2_frame_type: 0x3
    http2_stream_id: '>0'
    http2_error_code: '0x0'
  condition: sel and count > 100 in 5s
aliases:
  http2_frame_type: 'frame_type'
  http2_stream_id: 'stream_id'
  http2_error_code: 'error_code'
