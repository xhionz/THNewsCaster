title: Detect Android SMS-Click Traffic to Phishing Pages with Hash Fingerprint
logsource:
  product: web_proxy
  category: web
Detection:
  EventID: 1
  UserAgent: '.*Android.*'
  http_response_body: '.*<meta name="hash" content="[a-zA-Z0-9+/]{128}" />.*'
  referer: 'sms:|tel:|mms:|sms://'
condition: all
