    - '/_async/AsyncResponseService'
    - '/wls-wsat/CoordinatorPortType'
    - '/bea_wls_deployment_internal/DeploymentService'
condition: suspicious_uris
status: stable
level: high
title: Detect WebLogic CVE-2024-21182 Exploitation Attempt
