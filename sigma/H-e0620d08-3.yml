title: Lateral Movement from Ghost CMS Host to Internal Subnets
logsource:
  product: firewall
  service: netflow
detection:
  selection:
    src_ip: '192.168.10.5'  # Ghost CMS server IP
    dst_ip: '10.0.0.0/8'
    protocol: 'tcp'
    dst_port: [22, 445, 3389, 5985]
    bytes: > 100
  condition: selection
