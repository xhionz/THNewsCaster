title: Suspicious Bulk Data Exfiltration via Native Tools
logsource:
  product: windows
  service: sysmon
detection:
  Selection1:
    EventID: 3
    Image: '*\robocopy.exe'
    BytesSent: '>85000000000'
  Selection2:
    EventID: 3
    Image: '*\bitsadmin.exe'
    BytesSent: '>85000000000'
  Selection3:
    EventID: 3
    Image: '*\chrome.exe'
    BytesSent: '>85000000000'
  Selection4:
    EventID: 3
    Image: '*\firefox.exe'
    BytesSent: '>85000000000'
  Selection5:
    EventID: 3
    Image: '*\powershell.exe'
    BytesSent: '>85000000000'
  Condition: Selection1 or Selection2 or Selection3 or Selection4 or Selection5
  timeframe: 24h
keywords:
  - exfiltration
  - data transfer
