title: SeDebugPrivilege Assigned to Non-Admin via MConfig
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4672
    Privileges: '*SeDebugPrivilege*' 
    AccountName: '*'
  condition: selection
  filter:
    AccountName: 'Administrator' OR AccountName: 'SYSTEM' OR AccountName: 'LocalService' OR AccountName: 'NetworkService'
condition: selection and not filter
