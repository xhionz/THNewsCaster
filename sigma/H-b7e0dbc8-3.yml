title: Suspicious SMTP Relay from Vulnerable Exchange Server
logsource:
  product: exchange
  service: transport
detection:
  selection:
    EventID: 1016
    ClientIP|contains:
      - '192.168.'
      - '10.'
      - '172.16.'
      - '172.17.'
      - '172.18.'
      - '172.19.'
      - '172.20.'
      - '172.21.'
      - '172.22.'
      - '172.23.'
      - '172.24.'
      - '172.25.'
      - '172.26.'
      - '172.27.'
      - '172.28.'
      - '172.29.'
      - '172.30.'
      - '172.31.'
    MessageSubject|contains: ['urgent', 'invoice', 'click here', 'password', 'verify']
  condition: selection
