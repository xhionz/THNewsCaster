name: Build & deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/threat-hunting-news-platform-lcnD6
  schedule:
    # Rebuild the hunt package every 6 hours so live feeds stay fresh.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: |
          python -m pytest -q
          # Try a live pull first; fall back to the bundled offline sample
          # if the runner has restricted egress.
          PYTHONPATH=src python -m thnewscaster \
            --html --no-markdown --out-dir site \
            || PYTHONPATH=src python -m thnewscaster --offline \
                 --html --no-markdown --out-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
