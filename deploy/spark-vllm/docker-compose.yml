services:
  vllm:
    # IMPORTANT: the DGX Spark (GB10 Grace-Blackwell) is ARM64 (aarch64).
    # Use an image that has an arm64 build. vllm/vllm-openai publishes a
    # multi-arch manifest; if it doesn't resolve on your Spark, switch
    # VLLM_IMAGE to the NVIDIA NGC vLLM container for Spark (see README).
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: thnc-vllm
    restart: unless-stopped

    # Host 8001 -> container 8000. THNewsCaster points at http://<spark-ip>:8001/v1
    ports:
      - "${VLLM_PORT:-8001}:8000"

    environment:
      # Needed to download the model from Hugging Face the first time.
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1

    volumes:
      # Persist the (large) model weights across restarts.
      - ${HF_CACHE:-./hf-cache}:/root/.cache/huggingface

    # vLLM needs a large shared-memory segment.
    ipc: host

    # Expose all NVIDIA GPUs to the container.
    gpus: all

    # The vllm/vllm-openai entrypoint is the OpenAI API server; these are its args.
    command: >
      --model ${MODEL:-Qwen/Qwen3-Next-80B-A3B-Instruct-FP8}
      --served-model-name ${MODEL:-Qwen/Qwen3-Next-80B-A3B-Instruct-FP8}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.85}
      --enable-prefix-caching

    healthcheck:
      # No curl in the base image; use Python which is always present.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 1800s   # first run downloads ~80B weights; allow time
